[font]
base-size = 14

# Lock screen, migrated from the old hyprlock.conf. Values name theme palette
# roles, so the colors still follow the active theme.
[lock]
# input-field inner_color: theme background at ~40% alpha.
background       = "background"
background-alpha = 0.9
border-active    = "accent"
border-alpha     = 1.0

# Notifications: minimal dark translucent card with a thin muted border.
# Palette roles keep the colors following the active theme.
[notifications]
background       = "background"
background-alpha = 0.85
border-alpha     = 0.6
border-width     = 1
countdown        = "muted"
