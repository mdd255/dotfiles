# Kitty config — mirrored from .wezterm.lua
# ============================================

# Font
font_family FiraCode Nerd Font
font_size        11.5

# UI
background       #000000
background_opacity 0.9
cursor           #6cb6eb
cursor_text_color white
selection_background #6cb6eb
selection_foreground white
scrollback_lines 10000
window_padding_width 0
url_style dashed

# Tabs
tab_bar_style slant
tab_title_template "{title}"

# Misc
allow_remote_control yes
copy_on_select yes
confirm_os_window_close 0
strip_trailing_spaces always

# Keybindings
clear_all_shortcuts yes
map ctrl+r         set_tab_title " "
map alt+v          paste_from_clipboard
map alt+c          copy_to_clipboard
map ctrl+t         combine : new_tab_with_cwd : set_tab_title " "
map ctrl+q         close_tab
map ctrl+s         combine : set_tab_title cmd : goto_session ~/.config/dotfiles/kitty/sessions
map ctrl+n         scroll_page_down
map ctrl+e         scroll_page_up
map ctrl+tab       next_tab
map ctrl+shift+tab previous_tab

# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u

# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Allow cwd lookup from global keybindings
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}
